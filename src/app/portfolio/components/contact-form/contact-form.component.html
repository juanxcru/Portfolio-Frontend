<div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 mb-12">
  <form id="contact-form" class="space-y-6" [formGroup]="contactForm" (ngSubmit)="onSubmit()" name="form">
    <div>
      <label for="name" class="block text-sm font-medium text-slate-400 mb-2">{{ui().titles.name}}</label>
      <input
        type="text"
        id="name"
        name="name"
        formControlName="name"
        required
        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-colors"
        [placeholder]="ui().titles.namePh" 
        />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-400 mb-2">Email</label>
        <input
        type="email"
        id="email"
        name="email"
        required
        formControlName="email"
        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-colors"
        placeholder="juan@backend.com"
        />
      </div>
      <div>
        <label for="subject" class="block text-sm font-medium text-slate-400 mb-2">{{ui().titles.subject}}</label>
        <input
        type="text"
        id="subject"
        name="subject"
        formControlName="subject"
        required
        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-colors"
        [placeholder]="ui().titles.subjectPh"
        />
      </div>
      <div>
        <label for="message" class="block text-sm font-medium text-slate-400 mb-2">{{ui().titles.message}}</label>
        <textarea
        id="message"
        name="message"
        formControlName="message"
        rows="4"
        required
        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-colors resize-none"
        [placeholder]="ui().titles.messagePh"
      ></textarea>
    </div>
    <button
      type="submit"
      class="w-full py-3 bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 rounded-lg font-semibold hover:opacity-90 transition-all shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2"
    >
      <span>{{ui().actions.sendMessage}}</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M14 5l7 7m0 0l-7 7m7-7H3"
        />
      </svg>
    </button>
  </form>
  @if(contactForm.invalid && contactForm.touched){
    @for (msg of this.getFormErrors(); track $index) {
      <div id="form-message" class="mt-4 text-sm font-mono-code text-red-300">{{ msg }}</div>
    }
  }
</div>
