<section id="projects" class="scroll-mt-24 py-24">
  <div class="max-w-6xl mx-auto px-6">
    <div class="flex items-center gap-4 mb-12">
      <span class="font-mono-code text-emerald-400 text-sm">&lt;</span>
      <h2 class="text-3xl font-bold text-white">{{ui().sections.projects}}</h2>
      <span class="font-mono-code text-emerald-400 text-sm">/&gt;</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>
    @if (this.projectStore.state() == 'loading'){
      <app-loading mode='inline' [message]=ui().actions.loadingProjects></app-loading>
    }@else if (this.projectStore.state() == 'loaded') {
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (project of this.projects(); track $index) {
          <app-project-card [project]="project"></app-project-card>
        
        }
      </div>
        
      }
  </div>
</section>
