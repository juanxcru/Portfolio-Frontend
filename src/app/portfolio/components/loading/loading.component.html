<div
  [class.loading-fullscreen]="mode() === 'fullscreen'"
  [class.loading-inline]="mode() === 'inline'"
  class="loading-wrapper"
  aria-label="Loading..."
  role="status"
>
  <div class="spinner-container">
    <svg class="spinner-ring" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="spinnerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#10b981" />
          <stop offset="50%"  stop-color="#06b6d4" />
          <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
      <circle
        cx="32" cy="32" r="28"
        stroke="#1e293b"
        stroke-width="4"
      />
      <circle
        class="spinner-arc"
        cx="32" cy="32" r="28"
        stroke="url(#spinnerGradient)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="80 96"
        stroke-dashoffset="0"
      />
    </svg>

    <div class="spinner-dot"></div>
  </div>

  @if (message()) {
    <p class="loading-message font-mono-code">
      {{ message() }}<span class="terminal-cursor">_</span>
    </p>
  } @else {
    <p class="loading-message font-mono-code">
      <span class="terminal-cursor">_</span>
    </p>
  }
</div>
