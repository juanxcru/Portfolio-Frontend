<section id="contact" class="scroll-mt-24 py-24 bg-slate-900/30 mb-10">
  <div class="max-w-6xl mx-auto px-6">
    <div class="flex items-center gap-4 mb-12">
      <span class="font-mono-code text-emerald-400 text-sm">&lt;</span>
      <h2 class="text-3xl font-bold text-white">{{ui().sections.contact}}</h2>
      <span class="font-mono-code text-emerald-400 text-sm">/&gt;</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>
    <div class="grid md:grid-cols-2 gap-12">
      <app-contact-info [contactInfo]="contactInfo()" [socialLinks]="socialLinks()"></app-contact-info>
      <app-contact-form [emailInput]="contactInfo().email"></app-contact-form>
    </div>
  </div>
</section>
