<section id="experience" class="scroll-mt-24 py-24 bg-slate-900/30">
  <div class="max-w-6xl mx-auto px-6">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-12">
      <span class="font-mono-code text-emerald-400 text-sm">&lt;</span>
      <h2 class="text-3xl font-bold text-white">{{ui().sections.experience}}</h2>
      <span class="font-mono-code text-emerald-400 text-sm">/&gt;</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>

    <div class="relative">

      <div class="absolute left-[6px] top-0 h-full w-[2px] bg-slate-800"></div>

      <!-- Items -->
      <div class="space-y-12">
        @for (exp of this.experience().experience; track $index) {

          <div class="relative pl-12 group">

            <div class="absolute left-0 top-1/2 -translate-y-1/2 
            w-4 h-4 rounded-full bg-slate-800 border-2 border-slate-900 
            group-hover:bg-emerald-400 transition-colors"></div>

            <!-- Card -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6 card-hover 
                        transition-all duration-300 group-hover:border-emerald-500/50">

              <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
                <div>
                  <h3 class="text-xl font-semibold text-white">{{exp.role}}</h3>
                  <p class="text-emerald-400 font-medium">{{exp.company}}</p>
                </div>

                <span class="font-mono-code text-sm text-slate-500 bg-slate-800/50 px-3 py-1 rounded-full">
                  {{exp.from}} - {{exp.to}}
                </span>
              </div>

              <p class="text-slate-400 mb-4">
                {{exp.description}}
              </p>

              <div class="flex flex-wrap gap-2">
                @for (bullet of exp.bullets; track $index) {
                  <span class="px-3 py-1 bg-slate-800/50 rounded-full text-xs text-slate-400 font-mono-code">
                    {{bullet}}
                  </span>
                }
              </div>

            </div>

          </div>
        }
      </div>

    </div>
  </div>
</section>
